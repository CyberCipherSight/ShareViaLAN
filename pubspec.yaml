name: lancom
description: Local Area Network Communication App
publish_to: 'none'
version: 1.0.7+11

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  desktop_drop: ^0.6.0
  file_picker: ^12.3.0
  hive: ^2.2.3
  open_file: ^3.5.11
  path_provider: ^2.1.3
  permission_handler: ^12.0.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  video_player: ^2.10.1
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - Items/fornotification.mp3
    - Items/foropenchat.mp3
